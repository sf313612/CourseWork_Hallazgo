
services:
  ollama:
    image: ollama/ollama:latest
    container_name: hallazgo_ollama
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  
  ollama-init:
    image: ollama/ollama:latest
    container_name: hallazgo_ollama_init
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      - ollama
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until ollama list >/dev/null 2>&1; do
          echo "Waiting for Ollama...";
          sleep 2;
        done;
        ollama pull qwen2.5:1.5b-instruct
    restart: "no"


  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hallazgo_api
    ports:
      - "18080:18080"
    environment:
      OLLAMA_HOST: ollama
      OLLAMA_PORT: 11434
    volumes:
      - ../dataset/pg19:/data/pg19:ro
    depends_on:
      ollama:
        condition: service_started
      ollama-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  ollama_data:
