
services:
  ollama:
    image: ollama/ollama:latest
    container_name: hallazgo_ollama
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hallazgo_api
    ports:
      - "18080:18080"
    environment:
      OLLAMA_HOST: ollama
      OLLAMA_PORT: 11434
    volumes:
      - ../dataset/pg19:/data/pg19:ro
    depends_on:
      - ollama
    restart: unless-stopped

volumes:
  ollama_data:
