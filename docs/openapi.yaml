```yaml
openapi: 3.1.0

info:
  title: Hallazgo API
  version: 1.0.0
  description: |
    REST API for the Hallazgo literary search system.
    Provides backend health checks, document indexing,
    keyword-based book search, and index statistics.

servers:
  - url: http://localhost:18080
    description: Local development server

tags:
  - name: System
    description: Backend health and service availability.
  - name: Indexing
    description: Building the searchable document index.
  - name: Search
    description: Searching indexed literary documents.
  - name: Statistics
    description: Index statistics.

paths:
  /api/health:
    get:
      tags:
        - System
      operationId: getHealth
      summary: Get backend health
      description: |
        Checks whether the backend is running and whether
        the Ollama service is available.

        The endpoint returns HTTP 200 as long as the backend
        is responding, even if Ollama is unavailable.
      responses:
        "200":
          description: Backend is running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: ok
                ollama: true

  /api/index:
    post:
      tags:
        - Indexing
      operationId: startIndexing
      summary: Build the search index
      description: |
        Builds the inverted index from the available PG-19 documents.

        The operation is synchronous: the request waits until indexing
        finishes and then returns the result.

        Only one indexing operation can run at a time.
        Set max_documents to 0 to index all available documents.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IndexRequest'
            examples:
              fullDataset:
                summary: Index the entire dataset
                value:
                  threads: 8
                  max_documents: 0
              limitedDataset:
                summary: Index a limited number of documents
                value:
                  threads: 4
                  max_documents: 1000
      responses:
        "200":
          description: Indexing completed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexResponse'
              example:
                status: ok
                documents_indexed: 28602
                time_ms: 18250
        "400":
          description: Invalid request parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: invalid_request
                  message: The request data is invalid.
        "409":
          description: Another indexing operation is already running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: indexing_in_progress
                  message: Another indexing operation is already running.
        "500":
          description: An error occurred during indexing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: indexing_failed
                  message: Indexing failed.

  /api/search:
    post:
      tags:
        - Search
      operationId: searchBooks
      summary: Search indexed books
      description: |
        Searches the currently available index using keyword search.

        The query must contain at least one valid search token.
        Search is unavailable while indexing is in progress
        or when no successfully built index is available.

        Results are ordered by relevance score.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
            example:
              query: a shipwrecked sailor returns home after many years
              mode: keyword
      responses:
        "200":
          description: Search completed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
              examples:
                matches:
                  summary: Search with matching documents
                  value:
                    results:
                      - doc_id: "33318"
                        title: The Book of Buried Treasure by Ralph D. Paine
                        score: 22.1924
                        snippet: "...The Book of Buried Treasure..."
                    time_ms: 75216
                noMatches:
                  summary: Search without matching documents
                  value:
                    results: []
                    time_ms: 4
        "400":
          description: Invalid search request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: invalid_request
                  message: The request data is invalid.
        "503":
          description: The search index is not ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: index_not_ready
                  message: Indexing is in progress or no successfully built index is available for searching.

  /api/stats:
    get:
      tags:
        - Statistics
      operationId: getIndexStats
      summary: Get index statistics
      description: |
        Returns statistics for the current or most recently built index.
        The response contains the number of indexed documents,
        index build time, and number of threads used.
      responses:
        "200":
          description: Index statistics retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatsResponse'
              example:
                documents: 28602
                index_build_time_ms: 18250
                threads_used: 8

components:
  schemas:
    HealthResponse:
      type: object
      required:
        - status
        - ollama
      properties:
        status:
          type: string
          const: ok
          description: Backend status.
        ollama:
          type: boolean
          description: Whether the Ollama service is available.

    IndexRequest:
      type: object
      required:
        - threads
      properties:
        threads:
          type: integer
          minimum: 1
          description: Number of threads used for parallel indexing.
          example: 8
        max_documents:
          type: integer
          minimum: 0
          default: 0
          description: |
            Maximum number of documents to index.
            A value of 0 means that all available documents are indexed.
          example: 0

    IndexResponse:
      type: object
      required:
        - status
        - documents_indexed
        - time_ms
      properties:
        status:
          type: string
          const: ok
          description: Indexing operation status.
        documents_indexed:
          type: integer
          minimum: 0
          description: Number of documents successfully indexed.
          example: 28602
        time_ms:
          type: integer
          minimum: 0
          description: Total indexing time in milliseconds.
          example: 18250

    SearchRequest:
      type: object
      required:
        - query
        - mode
      properties:
        query:
          type: string
          minLength: 1
          description: Search query containing at least one valid token.
          example: a shipwrecked sailor returns home after many years
        mode:
          type: string
          enum:
            - keyword
          description: Search mode supported by the API.
          example: keyword

    SearchResponse:
      type: object
      required:
        - results
        - time_ms
      properties:
        results:
          type: array
          description: Matching documents ordered by relevance.
          items:
            $ref: '#/components/schemas/SearchResult'
        time_ms:
          type: integer
          minimum: 0
          description: Total search processing time in milliseconds.
          example: 75216

    SearchResult:
      type: object
      required:
        - doc_id
        - title
        - score
        - snippet
      properties:
        doc_id:
          type: string
          description: Unique identifier of the document.
          example: "33318"
        title:
          type: string
          description: Document title obtained from metadata.
          example: The Book of Buried Treasure by Ralph D. Paine
        score:
          type: number
          description: |
            Relevance score assigned to the document.
            Higher values indicate more relevant results.
          example: 22.1924
        snippet:
          type: string
          description: Text fragment extracted from the matching document.
          example: "...The Book of Buried Treasure..."

    StatsResponse:
      type: object
      required:
        - documents
        - index_build_time_ms
        - threads_used
      properties:
        documents:
          type: integer
          minimum: 0
          description: Number of documents currently indexed.
          example: 28602
        index_build_time_ms:
          type: integer
          minimum: 0
          description: Most recent index build time in milliseconds.
          example: 18250
        threads_used:
          type: integer
          minimum: 0
          description: Number of threads used for the most recent indexing operation.
          example: 8

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              description: Machine-readable error code.
              example: invalid_request
            message:
              type: string
              description: Human-readable error description.
              example: The request data is invalid.
```