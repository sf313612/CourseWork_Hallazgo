openapi: 3.1.2
info:
  title: Hallazgo API
  version: draft
  description: HTTP API for Hallazgo literary search and indexing.

paths:
  /api/health:
    get:
      operationId: getHealth
      summary: Get backend and Ollama status
      responses:
        "200":
          description: Backend health. This response remains 200 when Ollama is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: ok
                ollama: false

  /api/index:
    post:
      operationId: startIndexing
      summary: Start an indexing job
      description: Indexing runs in the background; only one indexing job may run at a time.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IndexRequest'
            example:
              threads: 4
      responses:
        "202":
          description: Indexing was accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexAccepted'
              example:
                job_id: job-123
        "400":
          description: Request data is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: invalid_request
                  message: The request data is invalid.
        "409":
          description: Another indexing job is active.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: indexing_in_progress
                  message: Another indexing job is already running.

  /api/search:
    post:
      operationId: searchBooks
      summary: Search indexed books
      description: >
        Search is unavailable while indexing is in progress
        or when no successfully built index is available.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
            example:
              query: a shipwrecked sailor returns home after many years
              mode: keyword
      responses:
        "200":
          description: Search completed. An empty results array means no books matched.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
              examples:
                matches:
                  value:
                    results:
                      - document_id: pg19-example
                        title: Example title
                        score: 0.93
                    search_time_ms: 7.4
                noMatches:
                  value:
                    results: []
                    search_time_ms: 4.1
        "400":
          description: Request data is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: invalid_request
                  message: The request data is invalid.
        "503":
          description: Indexing is in progress or no successfully built index 
            is available for searching.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: index_not_ready
                  message: Indexing is in progress or no successfully built index 
                    is available for searching.

  /api/stats:
    get:
      operationId: getIndexStats
      summary: Get current or most recent indexing status and statistics
      responses:
        "200":
          description: All indexing status and statistics fields are returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatsResponse'
              examples:
                beforeFirstIndex:
                  value:
                    indexing_status: null
                    processed_document_count: 0
                    total_document_count: null
                    index_build_time_ms: null
                    thread_count: null
                indexingInProgress:
                  value:
                    indexing_status: progress
                    processed_document_count: 4200
                    total_document_count: 10000
                    index_build_time_ms: null
                    thread_count: 4
                indexingCompleted:
                  value:
                    indexing_status: completed
                    processed_document_count: 10000
                    total_document_count: 10000
                    index_build_time_ms: 18250
                    thread_count: 4

components:
  schemas:
    HealthResponse:
      type: object
      required:
        - status
        - ollama
      properties:
        status:
          type: string
          const: ok
        ollama:
          type: boolean

    IndexRequest:
      type: object
      required:
        - threads
      properties:
        threads:
          type: integer
          minimum: 1

    IndexAccepted:
      type: object
      required:
        - job_id
      properties:
        job_id:
          type: string

    SearchRequest:
      type: object
      required:
        - query
        - mode
      properties:
        query:
          type: string
        mode:
          type: string
          enum:
            - keyword

    SearchResponse:
      type: object
      required:
        - results
        - search_time_ms
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/SearchResult'
        search_time_ms:
          type: number

    SearchResult:
      type: object
      required:
        - document_id
        - title
        - score
      properties:
        document_id:
          type: string
        title:
          type: string
        score:
          type: number
          description: Higher values mean more relevant results. The numeric range is unconstrained.

    IndexingStatus:
      type: string
      enum:
        - started
        - progress
        - completed
        - error

    StatsResponse:
      type: object
      required:
        - indexing_status
        - processed_document_count
        - total_document_count
        - index_build_time_ms
        - thread_count
      properties:
        indexing_status:
          anyOf:
            - $ref: '#/components/schemas/IndexingStatus'
            - type: 'null'
        processed_document_count:
          type: integer
          minimum: 0
        total_document_count:
          anyOf:
            - type: integer
              minimum: 0
            - type: 'null'
        index_build_time_ms:
          anyOf:
            - type: number
            - type: 'null'
        thread_count:
          anyOf:
            - type: integer
              minimum: 1
            - type: 'null'

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
            message:
              type: string